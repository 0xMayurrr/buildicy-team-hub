  <ellipse cx="23" cy="53" rx="5.5" ry="8" fill="#C4885F" />
  <ellipse cx="24" cy="53" rx="3.5" ry="5.5" fill="#9F6339" />
  <!-- Right Ear -->
  <ellipse cx="77" cy="53" rx="5.5" ry="8" fill="#C4885F" />
  <ellipse cx="76" cy="53" rx="3.5" ry="5.5" fill="#9F6339" />
  

  <!-- ================= HEAD BASE ================= -->
