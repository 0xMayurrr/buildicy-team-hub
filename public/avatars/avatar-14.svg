<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 3D Skin Radial Gradient (Highlight top-left, depth bottom-right) -->
    <radialGradient id="sk-avatar-14" cx="44%" cy="40%" r="56%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#E5B08C" />
      <stop offset="65%" stop-color="#C4885F" />
      <stop offset="100%" stop-color="#9F6339" />
    </radialGradient>

    <!-- 3D Hair Shading -->
    <linearGradient id="hr-avatar-14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F3330" />
      <stop offset="100%" stop-color="#201A18" />
    </linearGradient>

    <!-- 3D Depth Shadow Filter -->
    <filter id="sh-avatar-14" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= HAIR BACK LAYER (Mass behind head) ================= -->
  
  
  
  
  

