  <!-- Facial Hair -->
  
    <path d="M29 52 C29 76, 39 83, 50 83 C61 83, 71 76, 71 52 C71 58, 64 64, 58 64 C56 64, 54 62, 50 62 C46 62, 44 64, 42 64 C36 64, 29 58, 29 52 Z" fill="#201A18" opacity="0.94" />
    <path d="M40 64 Q50 61 60 64 Q50 66 40 64 Z" fill="#201A18" />
  
  

  <!-- Glasses -->
  
  

