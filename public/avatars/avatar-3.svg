      <stop offset="0%" stop-color="#3F3530" />
      <stop offset="100%" stop-color="#1F1A18" />
    </linearGradient>

    <!-- 3D Depth Shadow Filter -->
    <filter id="sh-avatar-3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-opacity="0.22" />
    </filter>
  </defs>

