<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 3D Skin Radial Gradient (Highlight top-left, depth bottom-right) -->
    <radialGradient id="sk-avatar-3" cx="44%" cy="40%" r="56%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#EABAA0" />
      <stop offset="65%" stop-color="#CB8B69" />
      <stop offset="100%" stop-color="#A3623D" />
    </radialGradient>

    <!-- 3D Hair Shading -->
