  <!-- Facial Hair -->
  
  
    <path d="M30 56 C32 76, 42 81, 50 81 C58 81, 68 76, 70 56 C68 67, 60 74, 50 74 C40 74, 32 67, 30 56 Z" fill="#1C1917" opacity="0.22" />
  

  <!-- Glasses -->
  
  

  <!-- ================= HAIR FRONT & TOP LAYER (100% Full Hair Coverage) ================= -->
  
  

  

  
    <!-- Glossy Slicked Back Hair with full crown volume -->
