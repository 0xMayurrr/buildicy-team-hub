    <circle cx="59" cy="50.8" r="0.9" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- 3D Nose -->
  <g>
    <path d="M49 46 L49 57 Q49 60 52 60" stroke="#A36B48" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />
    <ellipse cx="50" cy="59.5" rx="3.5" ry="1.6" fill="#A36B48" opacity="0.45" />
    <circle cx="49" cy="58" r="0.8" fill="#FFFFFF" opacity="0.25" />
  </g>

  <!-- 3D Smile -->
  <g>
    <path d="M42 67 Q50 75 58 67" stroke="#A36B48" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M45 67.5 Q50 72.5 55 67.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85" />
