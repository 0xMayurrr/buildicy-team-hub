<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 3D Skin Radial Gradient (Highlight top-left, depth bottom-right) -->
    <radialGradient id="sk-avatar-12" cx="44%" cy="40%" r="56%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#EABEA2" />
      <stop offset="65%" stop-color="#C99573" />
      <stop offset="100%" stop-color="#A36B48" />
    </radialGradient>

    <!-- 3D Hair Shading -->
    <linearGradient id="hr-avatar-12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38322E" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>

    <!-- 3D Depth Shadow Filter -->
    <filter id="sh-avatar-12" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= HAIR BACK LAYER (Mass behind head) ================= -->
  
  
  
  
  

  <!-- ================= NECK & EARS ================= -->
  <path d="M41 72 L41 94 C41 97, 59 97, 59 94 L59 72 Z" fill="#A36B48" />
  <path d="M42 72 C46 79, 54 79, 58 72 Z" fill="#A36B48" opacity="0.6" />

  <!-- Left Ear -->
  <ellipse cx="23" cy="53" rx="5.5" ry="8" fill="#C99573" />
  <ellipse cx="24" cy="53" rx="3.5" ry="5.5" fill="#A36B48" />
  <!-- Right Ear -->
  <ellipse cx="77" cy="53" rx="5.5" ry="8" fill="#C99573" />
  <ellipse cx="76" cy="53" rx="3.5" ry="5.5" fill="#A36B48" />
  

  <!-- ================= HEAD BASE ================= -->
  <path d="M26 44 C26 22, 74 22, 74 44 C74 66, 66 82, 50 82 C34 82, 26 66, 26 44 Z" fill="url(#sk-avatar-12)" filter="url(#sh-avatar-12)" />

