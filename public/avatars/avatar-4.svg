<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 3D Skin Radial Gradient (Highlight top-left, depth bottom-right) -->
    <radialGradient id="sk-avatar-4" cx="44%" cy="40%" r="56%" fx="38%" fy="32%">
      <stop offset="0%" stop-color="#F2C7A8" />
      <stop offset="65%" stop-color="#D69F78" />
      <stop offset="100%" stop-color="#B3744A" />
    </radialGradient>

    <!-- 3D Hair Shading -->
    <linearGradient id="hr-avatar-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#443E40" />
      <stop offset="100%" stop-color="#231F20" />
    </linearGradient>

    <!-- 3D Depth Shadow Filter -->
    <filter id="sh-avatar-4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ================= HAIR BACK LAYER (Mass behind head) ================= -->
  
  
  
  
  

  <!-- ================= NECK & EARS ================= -->
  <path d="M41 72 L41 94 C41 97, 59 97, 59 94 L59 72 Z" fill="#B3744A" />
  <path d="M42 72 C46 79, 54 79, 58 72 Z" fill="#B3744A" opacity="0.6" />

  <!-- Left Ear -->
  <ellipse cx="23" cy="53" rx="5.5" ry="8" fill="#D69F78" />
  <ellipse cx="24" cy="53" rx="3.5" ry="5.5" fill="#B3744A" />
  <!-- Right Ear -->
  <ellipse cx="77" cy="53" rx="5.5" ry="8" fill="#D69F78" />
  <ellipse cx="76" cy="53" rx="3.5" ry="5.5" fill="#B3744A" />
  

  <!-- ================= HEAD BASE ================= -->
  <path d="M26 44 C26 22, 74 22, 74 44 C74 66, 66 82, 50 82 C34 82, 26 66, 26 44 Z" fill="url(#sk-avatar-4)" filter="url(#sh-avatar-4)" />

  <!-- Cheeks Blush -->
  <ellipse cx="34" cy="58" rx="6" ry="4" fill="#EF4444" opacity="0.14" />
  <ellipse cx="66" cy="58" rx="6" ry="4" fill="#EF4444" opacity="0.14" />

  <!-- Eyebrows -->
  <path d="M33 43 Q40 38 46 41" stroke="#231F20" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M54 41 Q60 38 67 43" stroke="#231F20" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- 3D Big Glossy Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="40" cy="49" rx="4.8" ry="5.4" fill="#18181B" />
    <circle cx="41.5" cy="47.5" r="1.8" fill="#FFFFFF" />
    <circle cx="39" cy="50.8" r="0.9" fill="#FFFFFF" opacity="0.75" />
    <!-- Right Eye -->
    <ellipse cx="60" cy="49" rx="4.8" ry="5.4" fill="#18181B" />
    <circle cx="61.5" cy="47.5" r="1.8" fill="#FFFFFF" />
    <circle cx="59" cy="50.8" r="0.9" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- 3D Nose -->
  <g>
    <path d="M49 46 L49 57 Q49 60 52 60" stroke="#B3744A" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />
    <ellipse cx="50" cy="59.5" rx="3.5" ry="1.6" fill="#B3744A" opacity="0.45" />
    <circle cx="49" cy="58" r="0.8" fill="#FFFFFF" opacity="0.25" />
  </g>

  <!-- 3D Smile -->
  <g>
    <path d="M42 67 Q50 75 58 67" stroke="#B3744A" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M45 67.5 Q50 72.5 55 67.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>

  <!-- Facial Hair -->
  
  

  <!-- Glasses -->
  
    <circle cx="39" cy="49" r="8.5" fill="none" stroke="#18181B" stroke-width="2.2" />
    <circle cx="61" cy="49" r="8.5" fill="none" stroke="#18181B" stroke-width="2.2" />
    <path d="M47.5 49 L52.5 49" stroke="#18181B" stroke-width="2.2" />
    <path d="M34 45 L41 45" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
    <path d="M56 45 L63 45" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  
  

  <!-- ================= HAIR FRONT & TOP LAYER (100% Full Hair Coverage) ================= -->
  
  
    <!-- Thick Modern Crop covering full top, temples and forehead fringe -->
    <path d="M22 42 C20 20, 30 10, 50 10 C70 10, 80 20, 78 42 C78 45, 75 38, 72 34 C64 28, 56 34, 48 30 C40 34, 32 30, 26 36 C24 38, 22 45, 22 42 Z" fill="url(#hr-avatar-4)" filter="url(#sh-avatar-4)" />
    <!-- Bangs texture strands -->
    <path d="M32 32 L36 36 M44 30 L48 34 M56 31 L60 35 M66 33 L70 37" stroke="#443E40" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  

  

  

  

  

  

  

  

  

  

  

  

  
</svg>